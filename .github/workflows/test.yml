name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m compileall -q src tools tests
      - name: Run public element-mining demo
        run: python3 tools/mine_elements.py
      - name: Validate public evidence manifest
        run: python3 tools/build_evidence_manifest.py
      - name: Freeze and verify public source
        run: |
          python3 tools/freeze_artifact.py
          python3 tools/freeze_artifact.py --verify artifacts/freeze-v0.2.0-alpha.json

