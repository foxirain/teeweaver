[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teeweaver"
version = "0.3.0a1"
description = "Dynamic cross-world element mining and state-machine testing for OP-TEE"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{name = "Taegu Ha"}]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/foxirain/teeweaver"
Repository = "https://github.com/foxirain/teeweaver"
Issues = "https://github.com/foxirain/teeweaver/issues"

[project.scripts]
teeweaver = "teeweaver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
